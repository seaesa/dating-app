name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Cancel superseded runs on a branch, but never on main, where each commit's
  # result gates the image publish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The api package lints and typechecks through uv, which only the python
      # job installs.
      - name: Lint
        run: pnpm turbo run lint --filter=!api

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=!api

      - name: Check formatting
        run: pnpm format:check

      - name: Build web
        run: pnpm turbo run build --filter=web

  mobile:
    name: Mobile bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Catches a Metro or NativeWind break in minutes rather than in an EAS build.
      - name: Export bundles
        working-directory: apps/mobile
        run: pnpm exec expo export --platform all --output-dir dist

      - name: expo-doctor
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor@latest

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

  contract:
    name: Contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - working-directory: apps/api
        run: uv sync --frozen

      # Any diff means the committed client no longer describes the API.
      # --porcelain rather than `git diff`, so new untracked files count too.
      - name: Regenerate and compare
        run: |
          pnpm contract
          if [ -n "$(git status --porcelain -- packages/api-contract)" ]; then
            git status --porcelain -- packages/api-contract
            git diff -- packages/api-contract
            echo "::error::The committed contract is stale. Run 'pnpm contract' and commit the result."
            exit 1
          fi

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      # Build only. Publishing happens in docker-publish.yml once CI passes on
      # main; sharing the gha cache means that build is mostly a cache hit.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
