name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Cancel superseded runs on a branch, but never on main, where each commit's
  # result is the deploy gate.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint
        # The api package lints through uv (ruff), which this job deliberately
        # does not install — the python job owns it. Without the exclusion
        # turbo runs api:lint here and fails with `uv: command not found`.
        run: pnpm turbo run lint --filter=!api

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=!api

      - name: Check formatting
        run: pnpm format:check

      - name: Build web
        run: pnpm turbo run build --filter=web

      # No Python here on purpose: web and mobile build from the committed
      # client, and this job proves that stays true.
      - name: Foundation gate
        run: pnpm check:foundation

  mobile-bundle:
    name: Mobile bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Exports the JavaScript bundle for both platforms. Catches a Metro or
      # NativeWind break in three minutes rather than in a 20-minute EAS build.
      - name: Export bundles
        working-directory: apps/mobile
        run: pnpm exec expo export --platform all --output-dir dist

      - name: Check with expo-doctor
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor@latest

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Sync the environment
        working-directory: apps/api
        run: uv sync --frozen

      - name: Lint
        working-directory: apps/api
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Typecheck
        working-directory: apps/api
        run: uv run mypy

      # Real MongoDB, Redis and an S3 gateway, because these tests exist to
      # check unique indexes, geospatial queries and projections — the things a
      # mock fakes rather than enforces.
      #
      # The compose stack rather than testcontainers: MongoDB needs a replica
      # set for transactions, and a set initiated inside an ephemeral container
      # advertises a member address nothing outside it can reach.
      # `docker compose` directly rather than `pnpm services:up`: this job
      # installs no JavaScript toolchain, and the runner has no pnpm without it.
      - name: Start the service stack
        run: docker compose up -d --wait mongo redis s3

      - name: Test
        working-directory: apps/api
        run: uv run pytest -v

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 100

  contract:
    name: Contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Sync the environment
        working-directory: apps/api
        run: uv sync --frozen

      # Re-derives openapi.json from the code and the client from that document.
      # Any diff means the committed client no longer describes the API, which
      # would ship type-checked code that fails at runtime.
      - name: Regenerate the contract
        run: pnpm contract

      # --porcelain, not `git diff`: a newly generated file would be untracked,
      # and git diff does not see those.
      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain -- packages/api-contract)" ]; then
            git diff -- packages/api-contract
            git status --porcelain -- packages/api-contract
            echo "::error::The committed contract is stale. Run 'pnpm contract' and commit the result."
            exit 1
          fi

      - name: Start the service stack
        run: pnpm services:up

      - name: API gate
        run: pnpm check:api

  ui:
    name: UI gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: UI gate
        run: pnpm check:ui

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test the images
        run: node scripts/check-docker.mjs

  config:
    name: Config and docs gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Workflow configuration
        run: pnpm check:workflows

      # The guard written specifically to stop a build shipping the development
      # bundle id. Enforcing it only on a developer's machine is not enforcing it.
      - name: EAS build profiles
        run: pnpm check:eas

      - name: Documentation matches the code
        run: pnpm check:docs
