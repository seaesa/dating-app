name: Setup
description: Install pnpm, Node and the workspace dependencies with caching.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.5.1

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    # --frozen-lockfile matters: without it CI resolves fresh versions and can
    # pass on a dependency tree no developer has.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore the Turborepo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
