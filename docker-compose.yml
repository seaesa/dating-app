name: terdin-date

services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # This both INITIATES and verifies the replica set. It cannot be done from
      # docker-entrypoint-initdb.d: that runs while mongod is still on a local
      # socket, so a member addressed as mongo:27017 does not yet map to this
      # node and rs.initiate fails with NodeNotFound.
      #
      # Reporting healthy only once there is a primary also stops the API
      # starting and failing its first write.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage. MinIO's public images were withdrawn from Docker Hub and
  # quay.io, so this is SeaweedFS's S3 gateway instead — same S3 API, so
  # production still points at Cloudflare R2 or AWS S3 unchanged.
  #
  # It runs WITH an identities config on purpose. Unconfigured, the gateway
  # serves every object to anyone who guesses a key, which would make local
  # development quietly contradict this product's central rule that private
  # photos stay private.
  s3:
    image: chrislusf/seaweedfs:latest
    command:
      - server
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    healthcheck:
      # Plain curl, not `curl -f`: with the identities config above, an
      # anonymous GET / correctly returns 403. That answer proves the gateway
      # is up AND enforcing auth, which is exactly what healthy means here —
      # `-f` would read it as a failure and the service would never start.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Sends chat push notifications through Expo. The image bakes in the API
  # source, so rebuild after changing it: docker compose up -d --build push-worker
  push-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "app.cli", "push-worker"]
    restart: unless-stopped
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      # The compose network, not the host's localhost.
      MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379/0
    # The image's healthcheck curls the API port, which the worker does not open.
    healthcheck:
      disable: true
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Checks that a main photo shows a face; the API waits on it for every
  # profile photo. Rebuild after changing the API source.
  face-check-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "app.cli", "face-check-worker"]
    restart: unless-stopped
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:8333
      FACE_CHECK_ENABLED: "true"
    healthcheck:
      disable: true
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  mongo-data:
  s3-data:
