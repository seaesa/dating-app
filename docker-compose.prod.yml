name: terdin-date

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only service that publishes a port. Everything else is reachable
    # solely on the internal network.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  api:
    image: ghcr.io/${GITHUB_OWNER:-terdin}/terdin-date-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      # `:?` rather than a default: a missing value must stop the deploy, not
      # start the service pointing at nothing.
      MONGODB_URL: ${MONGODB_URL:?set MONGODB_URL}
      MONGODB_DB: ${MONGODB_DB:-terdin_date}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL}
      CORS_ORIGINS: https://${DOMAIN}
      LOG_JSON: "true"
    # Only binding under --profile selfhosted; with managed stores these
    # services are not started and `required: false` skips the wait.
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  web:
    image: ghcr.io/${GITHUB_OWNER:-terdin}/terdin-date-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production

  # Self-hosted data stores, behind a profile. Most deployments point
  # MONGODB_URL and REDIS_URL at a managed instance and never start these:
  #   docker compose -f docker-compose.prod.yml up -d
  # To run them here:
  #   docker compose -f docker-compose.prod.yml --profile selfhosted up -d
  mongo:
    image: mongo:8
    profiles: ["selfhosted"]
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    profiles: ["selfhosted"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  mongo-data:
  redis-data:
