<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Nền Dark Luxury Đồng Bộ Theme Terdin -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A1028" />
      <stop offset="60%" stop-color="#0E0C16" />
      <stop offset="100%" stop-color="#07060A" />
    </radialGradient>

    <!-- Gradient Khiên Chính -->
    <linearGradient id="shieldGradM" x1="88" y1="36" x2="424" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E7E" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Cạnh Kim Cương Phản Chiếu Ánh Sáng -->
    <linearGradient id="facetLightM" x1="93" y1="100" x2="256" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Trái Tim Lồng Ghép Gradient Bạch Kim -->
    <linearGradient id="heartGradM" x1="256" y1="140" x2="256" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>

    <!-- Hào Quang Phát Sáng Phía Sau Khiên -->
    <radialGradient id="shieldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#7928CA" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Nền Đầy Đủ Cho Safe Area Masking Của Android/Chromium -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Quầng Sáng Tỏa Sau Khiên -->
  <circle cx="256" cy="256" r="190" fill="url(#shieldAura)" />

  <!-- Khung Khiên Nằm Trọn Trong Safe Zone 80% (Bán kính 204px) -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <!-- Khung Khiên Bảo Mật Giác Cắt Kim Cương -->
    <path d="M256 36L88 100V238C88 349 160 451 256 482C352 451 424 349 424 238V100L256 36Z" fill="url(#shieldGradM)" />
    
    <!-- Cắt Vát Kim Cương Phía Trái -->
    <path d="M256 41L93 103V238C93 346 163 445 256 476V41Z" fill="url(#facetLightM)" />
    
    <!-- Cặp Trái Tim Đan Lồng Cách Điệu -->
    <path d="M256 168C232 139 186 143 168 175C151 206 172 250 256 307C340 250 361 206 344 175C326 143 280 139 256 168Z" fill="url(#heartGradM)" fill-opacity="0.96" />
    
    <!-- Chữ T Trung Tâm Biểu Tượng Quyền Lực -->
    <path d="M202 195H310V227H272V323H240V227H202V195Z" fill="#BE123C" />
    
    <!-- Ngôi Sao Sparkle Kết Đôi -->
    <path d="M256 88L269 122L303 135L269 148L256 182L243 148L209 135L243 122L256 88Z" fill="#FFFFFF" />
  </g>
</svg>
