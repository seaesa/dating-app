plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smsconsent'
version = '1.0.0'

android {
  namespace "expo.modules.smsconsent"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // SMS User Consent only: no READ_SMS permission, no app hash in the SMS.
  implementation "com.google.android.gms:play-services-auth-api-phone:18.0.2"
}
